name: Deploy

# Deploys the Worker *and* builds/pushes the Sandbox container image.
# This is what keeps Docker off the local machine: the image build happens on
# the GitHub runner, so day-to-day deployment is just `git push`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ubuntu-latest ships a running Docker daemon, which wrangler needs to
    # build the container image referenced by wrangler.jsonc.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A separate package with its own lockfile, so it needs its own install.
      # Built here rather than only at publish time: the SDK describes this API,
      # and a client that no longer compiles against it is a broken deploy that
      # nobody would notice until someone tried to install it.
      - name: Install SDK dependencies
        run: npm --prefix sdk install --no-audit --no-fund

      - name: Typecheck
        run: |
          npx wrangler types
          npm run typecheck
          npm run sdk:typecheck

      - name: Test
        run: npm test

      # The properties that only exist inside workerd. Separate because they need
      # a runtime rather than fakes — and load-bearing: removing the name-based
      # error classification fails three of them, which is how the defect they
      # were written for reached production in the first place.
      - name: Test inside workerd
        run: npm run test:workers

      - name: Build SDK
        run: npm run sdk:build

      - name: Deploy Worker and container image
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
