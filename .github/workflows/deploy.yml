name: Deploy

# Deploys the Worker *and* builds/pushes the Sandbox container image.
# This is what keeps Docker off the local machine: the image build happens on
# the GitHub runner, so day-to-day deployment is just `git push`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ubuntu-latest ships a running Docker daemon, which wrangler needs to
    # build the container image referenced by wrangler.jsonc.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: |
          npx wrangler types
          npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy Worker and container image
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
