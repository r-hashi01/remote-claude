name: Publish

# Publishes `@r-hashi01/remote-claude-client` from CI rather than from a laptop.
#
# The three releases before this one went out by hand, which meant a token on a
# personal machine, a 2FA prompt in the middle of the release, and nothing in the
# registry saying where the tarball came from. Publishing here replaces all three:
# npm trusts this workflow through OIDC (`id-token: write`), so there is no token
# to hold, and the published version carries provenance a consumer can verify.
#
# **npm side.** One of two things has to be configured there, and neither can be
# done from this repository:
#
#   1. A trusted publisher on npmjs.com for the package, pointing at this
#      repository and at this file *by name*. The match is on the filename, so
#      renaming this file breaks publishing until the setting is changed to match.
#      Preferred: no secret exists to leak, and npm is restricting the tokens that
#      bypass 2FA for direct publishing.
#   2. Failing that, an `NPM_TOKEN` repository secret (an automation token). Used
#      when it is present, so either arrangement works without editing this file.
#
# With neither, the publish fails with **404 on the PUT** — npm declines to say
# whether the package exists to somebody it does not recognise. That message reads
# as "wrong name" or "deleted package" and means "not authenticated"; it cost time
# twice before the step below started saying so out loud.
#
# **What triggers it.** A change to `sdk/package.json` landing on `main`. The
# version in the manifest is the decision — the same thing a reviewer read in the
# release pull request — so nothing has to be remembered or typed afterwards. It
# used to be a tag, which meant a release was a merge *and* a push, and the second
# half was a human step that could be forgotten, mistyped, or done by somebody who
# had not read the first half.
#
# Publishing the same version twice is not an error to guard against here: npm
# refuses it. The check below asks first anyway, so a re-run of an old commit is a
# no-op rather than a red build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sdk/package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # What npm exchanges for the right to publish. Without it the publish step
      # falls back to looking for a token, finds none, and fails.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing landed in npm 11.5.1, and the npm bundled with Node 22
      # is older than that. Without this the publish fails asking for credentials
      # that this workflow deliberately does not have.
      - name: Use an npm that can publish without a token
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install SDK dependencies
        run: npm --prefix sdk install --no-audit --no-fund

      # Is there anything to do? `sdk/package.json` changes for reasons other than a
      # release — a script, a dependency — and those merges should not fail for
      # having nothing to publish. Asked before anything is built, so the common
      # case costs one registry lookup.
      - name: Decide whether this version is new
        id: decide
        run: |
          version="$(node -p "require('./sdk/package.json').version")"
          name="$(node -p "require('./sdk/package.json').name")"
          published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "${name}@${version} is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing ${name}@${version}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.decide.outputs.publish == 'true'
        run: |
          npx wrangler types
          npm run typecheck
          npm run sdk:typecheck

      - name: Test
        if: steps.decide.outputs.publish == 'true'
        run: npm test

      - name: Test inside workerd
        if: steps.decide.outputs.publish == 'true'
        run: npm run test:workers

      # `prepublishOnly` builds again on the way out. Building here as well is
      # what makes a build failure a failed job rather than a failed publish.
      - name: Build SDK
        if: steps.decide.outputs.publish == 'true'
        run: npm run sdk:build

      # Which arrangement is in force, said before it matters rather than inferred
      # from a failure afterwards.
      - name: Say how this will authenticate
        if: steps.decide.outputs.publish == 'true'
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "authenticating with the NPM_TOKEN secret"
          else
            echo "no NPM_TOKEN secret; relying on npm trusted publishing for this workflow"
          fi

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        run: npm publish --provenance --access public
        working-directory: sdk
        env:
          # Empty when the secret is unset, which leaves trusted publishing to it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A 404 here is npm declining to recognise the publisher, not a missing
      # package. Anybody reading this log needs the two ways out, not the riddle.
      # Two refusals look nothing alike and mean nearly the same thing: this build
      # is not allowed to publish. Both were met on the way to the first CI release,
      # and both are cheaper to read than to diagnose.
      - name: Explain a refused publish
        if: failure() && steps.decide.outputs.publish == 'true'
        run: |
          cat <<'MESSAGE'
          The publish was refused. Two ways that happens, and what each means:

            404 on the PUT — npm does not recognise this publisher. It reads as a
            missing package and means "not authenticated".

            EOTP — the token was accepted, and the account requires a one-time
            password for publishing. CI cannot supply one. A classic *Automation*
            token bypasses 2FA where a granular one may not; trusted publishing
            needs no token at all.

          Either way, configure one of:

            1. Trusted publishing (preferred; nothing to hold, nothing to expire)
               npmjs.com -> the package -> Settings -> Trusted publisher
                 Publisher:  GitHub Actions
                 Repository: ${{ github.repository }}
                 Workflow:   publish.yml        (matched by filename)
                 Environment: leave empty, or add `environment:` to this job to match

            2. An NPM_TOKEN secret that does not need an OTP — a classic Automation
               token. Note npm is restricting those for direct publishing, so this
               is the stopgap and the first option is the answer.

          Then re-run this workflow; the version in sdk/package.json is unchanged,
          so nothing needs bumping.
          MESSAGE
          exit 1
